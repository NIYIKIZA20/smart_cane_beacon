# Smart Cane BEACON – prj.conf
# =====================================================================

CONFIG_MAIN_STACK_SIZE=2048

# GPIO / I2C / ADC
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_SENSOR=y

# Bluetooth — advertiser only (no connections, no scanning)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=n
CONFIG_BT_CENTRAL=n
CONFIG_BT_BROADCASTER=y
CONFIG_BT_OBSERVER=n
CONFIG_BT_DEVICE_NAME="SmartCaneBeacon"
CONFIG_BT_DEVICE_NAME_DYNAMIC=n

# Logging over J-Link RTT
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BUFFER_SIZE=2048

# Power management — important for battery life
CONFIG_PM=y
CONFIG_PM_DEVICE=y

# Memory
CONFIG_HEAP_MEM_POOL_SIZE=4096
